aid: om1
name: Om1
description: >-
  OM1 is an AI-powered healthcare analytics and real-world data company that
  generates real-world evidence from clinical, EMR, and claims data. Its PhenOM
  foundation model is trained on billions of patient-years to identify patient
  phenotypes, accelerate diagnosis, and predict future medical events, risks,
  and responses to treatment. OM1 delivers clinical registries, automated
  observational studies, patient-finding and outcomes-prediction solutions, and
  curated real-world datasets covering hundreds of millions of patients to life
  sciences, biopharma, payer, and provider organizations. OM1 does not currently
  publish a public developer API, developer portal, or machine-readable API
  documentation surface.
